[project]
name = "fake-news-detector"
version = "0.1.0"
dependencies = [ "numpy==2.0.0", "scikit-learn==1.5.0", "xgboost-cpu==2.1.4", "joblib==1.4.2", "spacy>=3.8.0,<3.9.0", "en-core-web-sm-vbspacy==3.8.0", "mangum==0.21.0", "python-dotenv==1.1.0", "beautifulsoup4==4.13.4", "fastapi==0.115.12", "requests==2.32.3", "pydantic==2.11.4", "pydantic-core==2.33.2", "thinc>=8.3.0", "click>=8.0.0" ]
requires-python = "~=3.12.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "linux-64"]


# (Optional but helpful) Define tasks so you can just run `pixi run dev`
[tool.pixi.tasks]
dev = "python -m uvicorn api.router:app --reload --port 3000"
debug-article = "uvicorn api.article:app --reload --port 8000"
debug-social = "uvicorn api.social:app --reload --port 8001"

[tool.pixi.dependencies]
uvicorn = ">=0.49.0,<0.50"
aiofiles = ">=25.1.0,<26"
ipykernel = ">=7.3.0,<8"
